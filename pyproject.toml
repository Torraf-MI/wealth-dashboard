[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-dashboard"
version = "0.1.0"
description = "Dashboard di monitoraggio del patrimonio mobiliare e immobiliare: allocazione, performance (TWR/MWR), immobili e mutui, segnali di ribilanciamento"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["wealth management", "dashboard", "streamlit", "portfolio monitoring", "rebalancing", "real estate"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.50",
]

[project.optional-dependencies]
png = ["kaleido>=1.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
wealth-dashboard = "wealth_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wealth_dashboard = ["esempio/*.csv", "esempio/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
